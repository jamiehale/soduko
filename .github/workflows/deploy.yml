name: Deploy

on:
  push:
    branches:
      - main
    # Docs-only pushes don't change the site
    paths-ignore:
      - 'openspec/**'
      - '.claude/**'
      - 'README.md'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://soduko.me
    # Queue deploys; never abort one halfway through an upload
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # The job needs only the Worker config; the site itself is CI's build artifact
      - name: Check out Worker config
        uses: actions/checkout@v7
        with:
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: 4.156.2
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
